schema_version: 5
name: QURBATA Jilid 1 Design Tokens
status: active

page:
  size: A5
  width_mm: 148
  height_mm: 210
  margin_top_mm: 5
  margin_right_mm: 8
  margin_bottom_mm: 2.5
  margin_left_mm: 8

colors:
  green: "#064d37"
  gold: "#b98a2f"
  ink: "#0b0b0b"
  soft: "#f7f8f5"
  muted: "#65736c"

fonts:
  arabic_family: "Amiri Quran"
  latin_family: "Inter"
  material_title_pt: 33
  single_object_pt: 39
  pair_object_pt: 32
  triple_object_pt: 27
  header_pt: 9.5
  target_pt: 6.2
  footer_pt: 7

spacing:
  title_token_gap_mm: 9
  pair_token_gap_mm: 4.5
  triple_token_gap_mm: 3.2
  group_gap_mm: 4
  footer_gap_mm: 3
  group_inline_safety_mm: 5
  section_vertical_gap_mm: 2.5

zones:
  header_height_mm: 13
  targets_height_mm: 18
  material_title_height_mm: 18
  singles_height_mm: 37
  pairs_height_mm: 43
  triples_height_mm: 50
  footer_height_mm: 7
  bottom_band_height_mm: 2.5

objects:
  singles_count: 6
  pairs_count: 8
  triples_count: 8
  show_group_labels: false
  show_object_boxes: false
  keep_letters_disconnected: true
  layout_engine: flex-rtl-safe-v2
  canonical_object_engine: true

arabic_rendering:
  engine: QAE
  profile_path: content/qwo/arabic-engine/anchors/jilid-1-short-vowels-native-v2.yaml
  direction: rtl
  split_base_and_marks: false
  mark_renderer: font-combining-mark
  font_feature_liga: false
  font_feature_calt: false

validation:
  competency_required: true
  object_engine_required: true
  render_only_after_validation: true

notes:
  - "Margin kanan-kiri Jilid 1 dipersempit agar latihan memiliki ruang horizontal lebih luas."
  - "Margin bawah disamakan dengan tinggi bottom band supaya footer dapat duduk tepat di atas band tanpa ruang kosong lebar."
  - "Harakat memakai combining mark font aktif; jarak antarbaris ditangani oleh layout, bukan dengan memindahkan glyph secara manual."
  - "PDF dan PNG tidak diedit langsung."
