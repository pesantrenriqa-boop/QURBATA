schema_version: 1
name: QURBATA Jilid 1 Design Tokens
status: draft

page:
  size: A5
  width_mm: 148
  height_mm: 210
  margin_top_mm: 7
  margin_right_mm: 12
  margin_bottom_mm: 7
  margin_left_mm: 12

colors:
  green: "#064d37"
  gold: "#b98a2f"
  ink: "#0b0b0b"
  soft: "#f7f8f5"
  muted: "#65736c"

fonts:
  arabic_family: "Amiri Quran"
  latin_family: "Inter"
  material_title_pt: 33
  single_object_pt: 39
  pair_object_pt: 34
  triple_object_pt: 29
  header_pt: 9.5
  target_pt: 6.2
  footer_pt: 7

spacing:
  title_token_gap_mm: 9
  pair_token_gap_mm: 4.5
  triple_token_gap_mm: 3
  group_gap_mm: 3
  footer_gap_mm: 3

zones:
  header_height_mm: 18
  targets_height_mm: 13
  material_title_height_mm: 19
  singles_height_mm: 36
  pairs_height_mm: 42
  triples_height_mm: 54
  footer_height_mm: 10
  bottom_band_height_mm: 3.5

objects:
  singles_count: 6
  pairs_count: 8
  triples_count: 8
  show_group_labels: true
  show_object_boxes: false
  keep_letters_disconnected: true

arabic_rendering:
  direction: rtl
  font_feature_mark: true
  font_feature_mkmk: true
  font_feature_liga: true
  font_feature_calt: true

notes:
  - "File ini adalah sumber tunggal untuk ukuran, margin, jarak, warna, dan tipografi."
  - "PDF dan PNG tidak diedit langsung; semua perubahan dilakukan melalui token ini atau data halaman."
