name: QJ8 fetch Tanzil source (manual only)
on:
  workflow_dispatch:
    inputs:
      accept_tanzil_terms:
        description: 'I have read and accept Tanzil terms (type YES)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require explicit Tanzil terms acceptance
        env:
          ACCEPT_TANZIL_TERMS: ${{ inputs.accept_tanzil_terms }}
        run: |
          test "$ACCEPT_TANZIL_TERMS" = "YES" || { echo "Terms not accepted: refusing download"; exit 1; }
      - name: Verify downloader and canonical reference tests offline
        run: |
          python scripts/qj8_test_download_validation.py
          python scripts/qj8_validate_context_manifest.py
      - name: Download official source and reject unexpected formats
        run: |
          python scripts/qj8_download_official_tanzil.py --accept-tanzil-terms --output /tmp/qj8-tanzil-uthmani.txt
      - name: Validate canonical references and select only required context
        run: |
          python scripts/qj8_import_tanzil_context.py --tanzil /tmp/qj8-tanzil-uthmani.txt --output /tmp/qj8-context.json
      - name: Verify all 12 canonical Saktah context ayat are present
        run: |
          python scripts/qj8_validate_canonical_saktah.py
          python scripts/qj8_verify_saktah_import.py --source /tmp/qj8-context.json
      - name: Generate HOLD preview, never overwrite master
        run: |
          python scripts/qj8_build_context.py --verses /tmp/qj8-context.json --output /tmp/qj8-context-HOLD.md
      - name: Check that preview is explicitly HOLD
        run: |
          grep -q "BELUM TASHIH" /tmp/qj8-context-HOLD.md
          grep -q "SOURCE_IMPORTED_NOT_TASHIH" /tmp/qj8-context.json
          test ! -e books/jilid-8/qj8-context-HOLD.md
      - name: Record source provenance for reviewer
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source=Path("/tmp/qj8-tanzil-uthmani.txt")
          context=json.loads(Path("/tmp/qj8-context.json").read_text(encoding="utf-8"))
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert context["source_sha256"] == digest, "Imported metadata does not match downloaded source"
          report={
              "source_url":"https://tanzil.net/pub/download/index.php",
              "source_sha256":digest,
              "required_saktah_context_ayat":12,
              "text_status":"SOURCE_IMPORTED_NOT_TASHIH",
              "print_status":"HOLD",
              "note":"Hash proves consistency of this download, not authenticity of its provider or recitation correctness"
          }
          Path("/tmp/qj8-source-provenance-HOLD.json").write_text(json.dumps(report,indent=2)+"\\n",encoding="utf-8")
          PY
      - name: Upload context artifact for tashih
        uses: actions/upload-artifact@v4
        with:
          name: qj8-context-hold
          path: |
            /tmp/qj8-context.json
            /tmp/qj8-context-HOLD.md
            /tmp/qj8-source-provenance-HOLD.json
          retention-days: 7
          if-no-files-found: error
