name: Render QURBATA NIDOM J1 Variative v2.2
on:
  workflow_dispatch:
  push:
    branches:
      - content/qurbata-jilid-1-8-production
    paths:
      - 'tools/render_nidom_j1_variative_v22.js'
      - 'tools/patch_nidom_v22_font_gate.js'
      - 'tools/patch_nidom_v22_eval_density.js'
      - '.github/workflows/render-nidom-j1-variative-v22.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install renderer
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Bind KFGQPC Uthman Taha Naskh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-fonts
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' -o .build-fonts/UthmanTaha.woff2
          test -s .build-fonts/UthmanTaha.woff2
      - name: Bind QURBATA logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/shared/assets
          cp books/shared/assets/qurbata-logo.svg dist/shared/assets/qurbata-logo.svg
          test -s dist/shared/assets/qurbata-logo.svg
      - name: Scope Uthman gate to Arabic pages
        run: node tools/patch_nidom_v22_font_gate.js
      - name: Compact evaluation pages
        run: node tools/patch_nidom_v22_eval_density.js
      - name: Render variative 40-page master
        run: node tools/render_nidom_j1_variative_v22.js
      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/nidom-akhlak/j1-variative-v22/QURBATA-NIDOM-J1-P001-P040-PRINT-MASTER-v2.2.pdf
          test -s dist/nidom-akhlak/j1-variative-v22/MANIFEST-v2.2.json
          COUNT=$(find dist/nidom-akhlak/j1-variative-v22 -maxdepth 1 -name 'QURBATA-NIDOM-J1-P???-v2.2.pdf' | wc -l)
          test "$COUNT" -eq 40
          grep -q '"pageCount": 40' dist/nidom-akhlak/j1-variative-v22/MANIFEST-v2.2.json
          grep -q '"competencies": 8' dist/nidom-akhlak/j1-variative-v22/MANIFEST-v2.2.json
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J1-VARIATIVE-v2.2
          path: |
            dist/nidom-akhlak/j1-variative-v22/*.pdf
            dist/nidom-akhlak/j1-variative-v22/MANIFEST-v2.2.json
          if-no-files-found: error