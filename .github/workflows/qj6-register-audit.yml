name: QURBATA J6 Register Audit
on:
  push:
    branches:
      - work/qj6-register-9-slot-20261028
    paths:
      - 'books/jilid-6/**'
      - '.github/workflows/qj6-register-audit.yml'
  pull_request:
    paths:
      - 'books/jilid-6/**'
      - '.github/workflows/qj6-register-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python3 -m unittest discover -s books/jilid-6/tools -p 'test_*.py' -v
      - name: Audit actual committed QJ6 register
        run: python3 books/jilid-6/tools/audit-qj6-register.py > /tmp/QJ6-committed-audit.json
      - name: Verify committed audit release holds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/QJ6-committed-audit.json').read_text(encoding='utf-8'))
          import csv
          with Path('books/jilid-6/tools/QJ6-slots.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          expected_empty = {r['slot_id'] for r in rows if r['review_status'] == 'EMPTY'}
          expected_missing_sign = {
              r['slot_id'] for r in rows
              if r['page_id'] == 'QJ6-P017'
              and r['review_status'] != 'EMPTY'
              and 'لا' not in r['text_uthmani']
          }
          holds = report['release_holds']
          actual_empty = {h['slot_id'] for h in holds if h['reason'] == 'unfilled_slot'}
          actual_missing_sign = {h['slot_id'] for h in holds if h['reason'] == 'waqf_la_glyph_missing'}
          assert report['errors'] == [], report['errors']
          assert report['print_approved'] is False
          assert report['rows'] == len(rows) == 360
          assert report['empty'] == len(expected_empty)
          assert report['filled'] == len(rows) - len(expected_empty)
          assert actual_empty == expected_empty
          assert actual_missing_sign == expected_missing_sign
          expected_source = {r['slot_id'] for r in rows if r['review_status'] != 'EMPTY' and r['source_verified'].lower() != 'yes'}
          expected_competency = {r['slot_id'] for r in rows if r['review_status'] != 'EMPTY' and r['competency_verified'].lower() != 'yes'}
          assert {h['slot_id'] for h in holds if h['reason'] == 'source_unverified'} == expected_source
          assert {h['slot_id'] for h in holds if h['reason'] == 'competency_unverified'} == expected_competency
          expected_research = {r['slot_id'] for r in rows if r['review_status'] == 'RESEARCH'}
          assert {h['slot_id'] for h in holds if h['reason'] == 'research_review_pending'} == expected_research
          assert len(holds) == sum(map(len, (expected_empty, expected_missing_sign, expected_source, expected_competency, expected_research)))
          print('Committed audit release holds and publication gate verified.')
          PY
      - name: Generate isolated 360-slot CSV
        run: |
          python3 books/jilid-6/tools/qj6_slots.py init --master books/jilid-6/QJ6-MASTER-Struktur-40-Halaman.md --csv /tmp/QJ6-slots.csv
      - name: Audit register
        run: |
          python3 books/jilid-6/tools/qj6_slots.py audit --master books/jilid-6/QJ6-MASTER-Struktur-40-Halaman.md --csv /tmp/QJ6-slots.csv --report /tmp/QJ6-audit.json
      - name: Upload reproducible register and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qj6-register-and-audit
          path: |
            /tmp/QJ6-slots.csv
            /tmp/QJ6-audit.json
            /tmp/QJ6-committed-audit.json
