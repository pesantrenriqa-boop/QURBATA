name: Render QURBATA NIDOM J1 Rebuild v2
on:
  workflow_dispatch:
  push:
    branches:
      - content/qurbata-jilid-1-8-production
    paths:
      - 'tools/render_nidom_j1_rebuild_v2.js'
      - '.github/workflows/render-nidom-j1-rebuild-v2.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install renderer
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Bind KFGQPC Uthman Taha Naskh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-fonts
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' -o .build-fonts/UthmanTaha.woff2
          test -s .build-fonts/UthmanTaha.woff2
      - name: Bind QURBATA logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/shared/assets
          cp books/shared/assets/qurbata-logo.svg dist/shared/assets/qurbata-logo.svg
          test -s dist/shared/assets/qurbata-logo.svg
      - name: Render rebuilt 40-page master
        run: node tools/render_nidom_j1_rebuild_v2.js
      - name: Verify production outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/nidom-akhlak/j1-rebuild-v2/QURBATA-NIDOM-J1-P001-P040-PRINT-MASTER-v2.0.pdf
          test -s dist/nidom-akhlak/j1-rebuild-v2/MANIFEST-v2.0.json
          COUNT=$(find dist/nidom-akhlak/j1-rebuild-v2 -maxdepth 1 -name 'QURBATA-NIDOM-J1-P???-v2.0.pdf' | wc -l)
          test "$COUNT" -eq 40
          grep -q '"themeCount": 7' dist/nidom-akhlak/j1-rebuild-v2/MANIFEST-v2.0.json
          grep -q '"pageCount": 40' dist/nidom-akhlak/j1-rebuild-v2/MANIFEST-v2.0.json
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J1-REBUILD-v2.0
          path: |
            dist/nidom-akhlak/j1-rebuild-v2/*.pdf
            dist/nidom-akhlak/j1-rebuild-v2/MANIFEST-v2.0.json
          if-no-files-found: error