name: QJ5 coverage audit
on:
  push:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 40-page Jilid 5 register coverage
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit_qj5_coverage.py 2>&1 | tee qj5-coverage-audit.log
      - name: Run QJ5 regression tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -v -s tests -p 'test_qj5_coverage.py' 2>&1 | tee qj5-regression-tests.log
      - name: Preserve audit and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qj5-audit-evidence
          path: |
            qj5-coverage-audit.log
            qj5-regression-tests.log
          if-no-files-found: warn
          retention-days: 30
