name: QJ5 coverage audit
on:
  push:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 40-page Jilid 5 register coverage
        id: coverage_audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit_qj5_coverage.py 2>&1 | tee qj5-coverage-audit.log
      - name: Run QJ5 regression tests
        id: regression_tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -v -s tests -p 'test_qj5_coverage.py' 2>&1 | tee qj5-regression-tests.log
      - name: Summarize QJ5 audit evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## QURBATA Jilid 5 — audit evidence'
            echo
            echo '| Check | Step outcome | Evidence |'
            echo '|---|---|---|'
            if [ -f qj5-coverage-audit.log ]; then
              coverage_summary=$(grep '^TOTAL:' qj5-coverage-audit.log | tail -n 1 || true)
              echo "| Register coverage | ${{ steps.coverage_audit.outcome }} | ${coverage_summary:-Log captured; no TOTAL line} |"
            else
              echo '| Register coverage | ${{ steps.coverage_audit.outcome }} | Log missing |'
            fi
            if [ -f qj5-regression-tests.log ]; then
              tests_summary=$(grep -E '^Ran [0-9]+ tests' qj5-regression-tests.log | tail -n 1 || true)
              result_summary=$(grep -E '^(OK|FAILED)' qj5-regression-tests.log | tail -n 1 || true)
              echo "| Regression tests | ${{ steps.regression_tests.outcome }} | ${tests_summary:-No test count}; ${result_summary:-No result line} |"
            else
              echo '| Regression tests | ${{ steps.regression_tests.outcome }} | Log missing |'
            fi
            echo
            echo 'The overall job conclusion remains authoritative; captured logs do not imply success.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve audit and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qj5-audit-evidence
          path: |
            qj5-coverage-audit.log
            qj5-regression-tests.log
          if-no-files-found: warn
          retention-days: 30
