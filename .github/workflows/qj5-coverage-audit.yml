name: QJ5 coverage audit
on:
  push:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REVIEW_DUPLIKASI_INTERNAL_JILID_5_2026-11-09.md'
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/LEMBAR_TASHIH_P040_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_5.md'
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REVIEW_DUPLIKASI_INTERNAL_JILID_5_2026-11-09.md'
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/LEMBAR_TASHIH_P040_JILID_5.md'
      - 'scripts/audit_qj5_coverage.py'
      - 'tests/test_qj5_coverage.py'
      - '.github/workflows/qj5-coverage-audit.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 40-page Jilid 5 register coverage
        id: coverage_audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit_qj5_coverage.py 2>&1 | tee qj5-coverage-audit.log
      - name: Run QJ5 regression tests
        id: regression_tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -v -s tests -p 'test_qj5_coverage.py' 2>&1 | tee qj5-regression-tests.log
      - name: Summarize QJ5 audit evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## QURBATA Jilid 5 — audit evidence'
            echo
            echo '| Check | Step outcome | Evidence |'
            echo '|---|---|---|'
            if [ -f qj5-coverage-audit.log ]; then
              coverage_summary=$(grep '^TOTAL:' qj5-coverage-audit.log | tail -n 1 || true)
              echo "| Register coverage | ${{ steps.coverage_audit.outcome }} | ${coverage_summary:-Log captured; no TOTAL line} |"
            else
              echo '| Register coverage | ${{ steps.coverage_audit.outcome }} | Log missing |'
            fi
            if [ -f qj5-regression-tests.log ]; then
              tests_summary=$(grep -E '^Ran [0-9]+ tests' qj5-regression-tests.log | tail -n 1 || true)
              result_summary=$(grep -E '^(OK|FAILED)' qj5-regression-tests.log | tail -n 1 || true)
              echo "| Regression tests | ${{ steps.regression_tests.outcome }} | ${tests_summary:-No test count}; ${result_summary:-No result line} |"
            else
              echo '| Regression tests | ${{ steps.regression_tests.outcome }} | Log missing |'
            fi
            echo
            if [ -f qj5-coverage-audit.log ]; then
              echo
              echo '### Human tashih review (advisory; not a pass/fail decision)'
              grep '^ADVISORY: .*same-page phrase groups' qj5-coverage-audit.log || true
              grep '^ADVISORY: .*repeated same-page Quran reference groups' qj5-coverage-audit.log || true
              grep '^ADVISORY P040 ' qj5-coverage-audit.log || true
              echo 'Do not replace Quran text or increase Sah based on these advisories.'
            fi
            echo
            echo '### P040 human approval gate'
            if grep -Fq 'Izin pembaruan register: **BELUM DIBERIKAN**' '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/LEMBAR_TASHIH_P040_JILID_5.md'; then
              echo 'P040: approval pending. Keep Sah at 0/8; no automatic Quran text changes.'
            else
              echo 'P040: approval marker changed or unavailable. Require manual review of the worksheet and register; CI is not tashih.'
            fi
            echo 'The overall job conclusion remains authoritative; captured logs do not imply success.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record CI evidence provenance
        if: always()
        shell: bash
        run: |
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "coverage_step=${{ steps.coverage_audit.outcome }}"
            echo "tests_step=${{ steps.regression_tests.outcome }}"
            grep -E '^Ran [0-9]+ tests' qj5-regression-tests.log | tail -n 1 || true
            grep -E '^(OK|FAILED)' qj5-regression-tests.log | tail -n 1 || true
          } > qj5-ci-provenance.txt
      - name: Preserve audit and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qj5-audit-evidence
          path: |
            qj5-coverage-audit.log
            qj5-regression-tests.log
            qj5-ci-provenance.txt
          if-no-files-found: warn
          retention-days: 30
