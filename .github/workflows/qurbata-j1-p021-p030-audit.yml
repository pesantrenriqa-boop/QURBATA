name: QURBATA J1 P021-P030 Audit

on:
  push:
    branches:
      - prod/j1-p021-p030-from-frozen-register
    paths:
      - 'production/vivliostyle/**'
      - '03_BOOKS/JILID-1/PAGE_REGISTER_P021-P030_FROZEN-v1.0.md'
      - '.github/workflows/qurbata-j1-p021-p030-audit.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/vivliostyle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: production/vivliostyle/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build P021-P030 audit PDF
        run: npm run build:p021-p030:pdf
      - name: Verify artifact
        run: |
          test -s dist/QURBATA-J1-P021-P030-AUDIT.pdf
          pdfinfo dist/QURBATA-J1-P021-P030-AUDIT.pdf | grep -q 'Pages:          10'
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: QURBATA-J1-P021-P030-AUDIT
          path: production/vivliostyle/dist/QURBATA-J1-P021-P030-AUDIT.pdf
