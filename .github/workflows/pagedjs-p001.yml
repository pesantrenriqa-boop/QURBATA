name: Paged.js J1 Renderer Audit
# audit-trigger: full P001-P040 candidate + detached-heh visual gate
on:
  push:
    branches: [renderer/pagedjs-p001-prototype]
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/vivliostyle
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Paged.js dependencies without bundled Chromium
        run: npm install --no-audit --no-fund --ignore-scripts
        timeout-minutes: 3
      - name: Verify system Chrome
        run: google-chrome --version
      - run: mkdir -p dist/fonts && cp fonts/KFGQPC-Uthman-Taha-Naskh.woff2 dist/fonts/KFGQPC-Uthman-Taha-Naskh.woff2
      - run: npm run build:pagedjs:p001-p040:pdf
        timeout-minutes: 5
      - name: Audit detached heh sentinel wiring
        run: |
          grep -q 'heh-two-hole' scripts/build-pagedjs-p001-p010.mjs
          grep -q 'Uthman' scripts/build-pagedjs-p001-p010.mjs
          echo "HA_SENTINEL_SOURCE_PASS"
      - name: Record renderer audit manifest
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "font=KFGQPC-Uthman-Taha-Naskh"
            echo "unicode_heh=U+0647"
            echo "sentinels=P013:P019:P027:P040"
            echo "status=VISUAL_REVIEW_REQUIRED"
          } > dist/HA-TWO-HOLE-AUDIT.txt
      - name: Render detached-heh visual proof
        run: |
          cat > dist/heh-proof.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><style>
          @font-face{font-family:Uthman;src:url("./fonts/KFGQPC-Uthman-Taha-Naskh.woff2")}
          body{margin:0;background:white;font-family:Uthman,serif}
          .proof{width:1200px;height:800px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center}
          .s{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:.78em;font-size:180px;line-height:1}
          .s:before,.s:after{content:"";position:absolute;box-sizing:border-box;border:.045em solid currentColor;border-radius:50%;pointer-events:none;z-index:2}
          .s:before{width:.15em;height:.105em;left:43%;top:43%;transform:translate(-50%,-50%)}
          .s:after{width:.15em;height:.105em;left:57%;top:55%;transform:translate(-50%,-50%)}
          small{display:block;font-family:Arial,sans-serif;font-size:24px;margin-top:40px}
          </style></head><body><div class="proof">
          <div><span class="s">هَ</span><small>P013 · U+0647 + FATHA</small></div>
          <div><span class="s">هِ</span><small>P019 · U+0647 + KASRA</small></div>
          <div><span class="s">هُ</span><small>P027 · U+0647 + DAMMA</small></div>
          <div><span class="s">ه</span><small>P040 · U+0647</small></div>
          </div></body></html>
          EOF
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1200,800 --screenshot=dist/HA-TWO-HOLE-PROOF.png file://$PWD/dist/heh-proof.html
          test -s dist/HA-TWO-HOLE-PROOF.png
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-P001-P040-PAGEDJS
          path: |
            production/vivliostyle/dist/QURBATA-J1-P001-P040-PAGEDJS.pdf
            production/vivliostyle/dist/HA-TWO-HOLE-AUDIT.txt
            production/vivliostyle/dist/HA-TWO-HOLE-PROOF.png
