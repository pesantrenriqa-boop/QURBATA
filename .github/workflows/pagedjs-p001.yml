name: Paged.js P001 Prototype
on:
  push:
    branches: [renderer/pagedjs-p001-prototype]
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/vivliostyle
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Paged.js dependencies without bundled Chromium
        run: npm install --no-audit --no-fund --ignore-scripts
        timeout-minutes: 3
      - name: Verify system Chrome
        run: google-chrome --version
      - run: mkdir -p dist/fonts && cp fonts/KFGQPC-Uthman-Taha-Naskh.woff2 dist/fonts/KFGQPC-Uthman-Taha-Naskh.woff2
      - run: npm run build:pagedjs:p001-p010:pdf
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-P001-P010-PAGEDJS
          path: production/vivliostyle/dist/QURBATA-J1-P001-P010-PAGEDJS.pdf
