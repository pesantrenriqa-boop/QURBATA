name: Render QURBATA NIDOM J2 v0.1
on:
  workflow_dispatch:
  push:
    branches: [content/qurbata-jilid-1-8-production]
    paths:
      - 'tools/render_nidom_j2_v01.js'
      - 'tools/patch_nidom_j2_font_gate_v02.js'
      - 'tools/patch_nidom_j2_embed_assets_v03.js'
      - '.github/workflows/render-nidom-j2-v01.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install renderer
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Bind Uthman Taha and logo
        run: |
          mkdir -p .build-fonts dist/shared/assets
          curl -fL --retry 3 'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' -o .build-fonts/UthmanTaha.woff2
          cp books/shared/assets/qurbata-logo.svg dist/shared/assets/qurbata-logo.svg
      - name: Patch Uthman font gate
        run: node tools/patch_nidom_j2_font_gate_v02.js
      - name: Embed font and logo
        run: node tools/patch_nidom_j2_embed_assets_v03.js
      - name: Render Jilid 2
        run: node tools/render_nidom_j2_v01.js
      - name: Verify master and 40 pages
        run: |
          test -s dist/nidom-akhlak/j2-v01/QURBATA-NIDOM-J2-P001-P040-PRINT-MASTER-v0.1.pdf
          COUNT=$(find dist/nidom-akhlak/j2-v01 -maxdepth 1 -name 'QURBATA-NIDOM-J2-P???-v0.1.pdf' | wc -l)
          test "$COUNT" -eq 40
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J2-v0.1-P001-P040
          path: dist/nidom-akhlak/j2-v01/*.pdf
          if-no-files-found: error