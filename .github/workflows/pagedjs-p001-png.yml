name: QURBATA P001 PNG via Paged.js
on:
  workflow_dispatch:
  push:
    branches: [renderer/pagedjs-p001-prototype]
    paths: ['.github/workflows/pagedjs-p001-png.yml']
jobs:
  p001:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: production/vivliostyle
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Paged.js dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Set approved P001 reading exercise source
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          p=pathlib.Path('scripts/build-pagedjs-p001.mjs')
          s=p.read_text()
          drills=[
            "بَ تَ","بَ ثَ","تَ بَ","تَ ثَ","ثَ بَ","ثَ تَ",
            "بَ تَ ثَ","بَ ثَ تَ","تَ بَ ثَ","تَ ثَ بَ","ثَ بَ تَ","ثَ تَ بَ",
            "بَ بَ تَ","بَ بَ ثَ","تَ تَ بَ","تَ تَ ثَ","ثَ ثَ بَ","ثَ ثَ تَ",
            "بَ تَ بَ","بَ ثَ بَ","تَ بَ تَ","تَ ثَ تَ","ثَ بَ ثَ","ثَ تَ ثَ"
          ]
          assert len(drills)==24
          s,n=re.subn(r'const exercises=\[.*?\];', 'const exercises='+json.dumps(drills,ensure_ascii=False)+';',s,count=1,flags=re.S)
          assert n==1, 'Renderer P001 exercise declaration not found'
          p.write_text(s)
          PY
      - name: Copy official Arabic font
        run: mkdir -p dist/fonts && cp fonts/KFGQPC-Uthman-Taha-Naskh.woff2 dist/fonts/
      - name: Render P001 using Paged.js
        run: npm run build:pagedjs:p001:pdf
      - name: Export only P001 to PNG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -r 200 -png dist/QURBATA-J1-P001-PAGEDJS.pdf dist/QURBATA-J1-P001-PAGEDJS
          test -s dist/QURBATA-J1-P001-PAGEDJS.png
          pdfinfo dist/QURBATA-J1-P001-PAGEDJS.pdf | grep Pages
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-J1-P001-PAGEDJS-PNG
          path: |
            production/vivliostyle/dist/QURBATA-J1-P001-PAGEDJS.png
            production/vivliostyle/dist/QURBATA-J1-P001-PAGEDJS.pdf
