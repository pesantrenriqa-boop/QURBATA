name: QURBATA P001 Original Layout PNG
on:
  workflow_dispatch:
  push:
    branches: [renderer/pagedjs-p001-prototype]
    paths: ['.github/workflows/pagedjs-p001-png.yml']
jobs:
  p001:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: production/vivliostyle
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install original renderer dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Prepare P001 with ORIGINAL 40-page master layout and approved drills
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          p=pathlib.Path('scripts/build-pagedjs-p001-p010.mjs')
          s=p.read_text()
          drills=[
            "بَ تَ","بَ ثَ","تَ بَ","تَ ثَ","ثَ بَ","ثَ تَ",
            "بَ تَ ثَ","بَ ثَ تَ","تَ بَ ثَ","تَ ثَ بَ","ثَ بَ تَ","ثَ تَ بَ",
            "بَ بَ تَ","بَ بَ ثَ","تَ تَ بَ","تَ تَ ثَ","ثَ ثَ بَ","ثَ ثَ تَ",
            "بَ تَ بَ","بَ ثَ بَ","تَ بَ تَ","تَ ثَ تَ","ثَ بَ ثَ","ثَ تَ ثَ"
          ]
          assert len(drills)==24
          s,n=re.subn(r'const p1=\[.*?\];','const p1='+json.dumps(drills,ensure_ascii=False)+';',s,count=1,flags=re.S)
          assert n==1, 'P001 source declaration missing'
          s,n=re.subn(r'specs\.map\(page\)\.join\(" "\)', 'specs.filter(spec=>spec.n===1).map(page).join("")',s,count=1)
          if n!=1:
            s,n=re.subn(r'specs\.map\(page\)\.join\(""\)', 'specs.filter(spec=>spec.n===1).map(page).join("")',s,count=1)
          assert n==1, 'Original master page selection not found'
          p.write_text(s)
          PY
      - name: Build ORIGINAL P001 HTML
        run: |
          mkdir -p dist/fonts
          cp fonts/KFGQPC-Uthman-Taha-Naskh.woff2 dist/fonts/
          node scripts/build-pagedjs-p001-p010.mjs
      - name: Render P001 with Paged.js
        run: pagedjs-cli dist/QURBATA-J1-P001-P040-PAGEDJS.html -o dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.pdf --browserArgs '--no-sandbox,--disable-setuid-sandbox'
      - name: Export PNG and validate one page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          test "$(pdfinfo dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.pdf | awk '/^Pages:/{print $2}')" = "1"
          pdftoppm -f 1 -singlefile -r 240 -png dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.pdf dist/QURBATA-J1-P001-ORIGINAL-LAYOUT
          test -s dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.png
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-J1-P001-ORIGINAL-LAYOUT-PNG
          path: |
            production/vivliostyle/dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.png
            production/vivliostyle/dist/QURBATA-J1-P001-ORIGINAL-LAYOUT.pdf
