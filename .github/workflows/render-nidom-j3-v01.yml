name: Render QURBATA NIDOM J3 v0.1
on:
  workflow_dispatch:
  push:
    branches: [content/qurbata-jilid-1-8-production]
    paths:
      - 'tools/render_nidom_j3_v01.js'
      - '.github/workflows/render-nidom-j3-v01.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Prepare Uthman Taha
        run: |
          mkdir -p .build-fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' -o .build-fonts/UthmanTaha.woff2
      - name: Render 40 pages
        run: node tools/render_nidom_j3_v01.js
      - name: Verify
        run: |
          test -s dist/nidom-akhlak/j3-v01/QURBATA-NIDOM-J3-P001-P040-PRINT-MASTER-v0.1.pdf
          COUNT=$(find dist/nidom-akhlak/j3-v01 -maxdepth 1 -name 'QURBATA-NIDOM-J3-P???-v0.1.pdf' | wc -l)
          test "$COUNT" -eq 40
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J3-v0.1-P001-P040
          path: dist/nidom-akhlak/j3-v01/*.pdf
          if-no-files-found: error