name: Render QURBATA NIDOM P001

on:
  workflow_dispatch:
  push:
    branches:
      - content/qurbata-jilid-1-8-production
    paths:
      - 'books/nidom-akhlak/**'
      - 'tools/render_nidom_p001.js'
      - '.github/workflows/render-nidom-p001.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Bind KFGQPC Uthman Taha Naskh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-fonts /tmp/uthman-font
          if curl -fL --retry 3 --connect-timeout 20 \
            'https://fonts.qurancomplex.gov.sa/wp-content/uploads/2012/06/UthmanTN1-Ver10.zip' \
            -o /tmp/uthman-font/font.zip; then
            unzip -q /tmp/uthman-font/font.zip -d /tmp/uthman-font/unpacked
            FONT=$(find /tmp/uthman-font/unpacked -type f -iname '*.ttf' | head -n 1 || true)
            if [ -n "$FONT" ]; then cp "$FONT" .build-fonts/UthmanTaha.ttf; fi
          fi
          if [ ! -s .build-fonts/UthmanTaha.ttf ]; then
            curl -fL --retry 3 \
              'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' \
              -o .build-fonts/UthmanTaha.woff2
          fi
          test -s .build-fonts/UthmanTaha.ttf || test -s .build-fonts/UthmanTaha.woff2
          ls -lh .build-fonts/

      - name: Render print PDF + PNG
        run: node tools/render_nidom_p001.js

      - name: Verify outputs
        run: |
          test -s dist/nidom-akhlak/QURBATA-NIDOM-J1-P001-v0.3.pdf
          test -s dist/nidom-akhlak/QURBATA-NIDOM-J1-P001-v0.3.png

      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J1-P001-v0.3
          path: |
            dist/nidom-akhlak/QURBATA-NIDOM-J1-P001-v0.3.pdf
            dist/nidom-akhlak/QURBATA-NIDOM-J1-P001-v0.3.png
          if-no-files-found: error
