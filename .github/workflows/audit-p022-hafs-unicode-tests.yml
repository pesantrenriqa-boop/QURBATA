name: P022 Hafs Unicode verifier tests
on:
  push:
    branches:
      - audit/j4-tashih-20261024
    paths:
      - 'tools/audit_p022_hafs_unicode.py'
      - 'tools/test_audit_p022_hafs_unicode.py'
      - '02_MASTER_SYSTEM/BANK_REFERENSI_PER_KOMPETENSI/REGISTER_24_KELOMPOK_JILID_4.md'
      - '.github/workflows/audit-p022-hafs-unicode-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile tools/audit_p022_hafs_unicode.py tools/test_audit_p022_hafs_unicode.py
      - name: Run offline regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools -p 'test_audit_p022_hafs_unicode.py' -v 2>&1 | tee p022-unittest.log
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## P022 Hafs Unicode offline regression'
            echo ''
            echo 'This job tests checker behavior only; it does not authenticate KFGQPC data or approve Quran text for printing.'
            echo ''
            if [ -f p022-unittest.log ]; then
              echo '### Test result'
              echo '~~~'
              tail -n 12 p022-unittest.log
              echo '~~~'
            else
              echo 'No test log generated; check syntax and setup steps.'
            fi
            echo ''
            echo '**Print approval: HOLD (0/16).**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: p022-unittest-log
          path: p022-unittest.log
          if-no-files-found: warn
          retention-days: 30
