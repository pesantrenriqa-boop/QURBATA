name: P022 Hafs Unicode verifier tests
on:
  push:
    branches:
      - audit/j4-tashih-20261024
    paths:
      - 'tools/audit_p022_hafs_unicode.py'
      - 'tools/test_audit_p022_hafs_unicode.py'
      - '.github/workflows/audit-p022-hafs-unicode-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile tools/audit_p022_hafs_unicode.py tools/test_audit_p022_hafs_unicode.py
      - name: Run offline regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools -p 'test_audit_p022_hafs_unicode.py' -v 2>&1 | tee p022-unittest.log
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p022-unittest-log
          path: p022-unittest.log
          if-no-files-found: warn
          retention-days: 30
