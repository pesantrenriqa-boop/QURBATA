name: Render QURBATA NIDOM J1 Batch P012-P040
on:
  workflow_dispatch:
  push:
    branches:
      - content/qurbata-jilid-1-8-production
    paths:
      - 'tools/render_nidom_j1_batch_p012_p040.js'
      - '.github/workflows/render-nidom-j1-batch-p012-p040.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Bind KFGQPC Uthman Taha Naskh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-fonts /tmp/uthman-font
          if curl -fL --retry 2 --connect-timeout 10 --max-time 30 'https://raw.githubusercontent.com/quranwbw/qpc-fonts/master/various-woff2/UthmanTN1%20Ver10.woff2' -o .build-fonts/UthmanTaha.woff2; then
            echo 'BOUND_FONT=KFGQPC_UTHMAN_TAHA_NASKH_VER10_WOFF2'
          else
            rm -f .build-fonts/UthmanTaha.woff2
            curl -fL --retry 1 --connect-timeout 10 --max-time 30 'https://fonts.qurancomplex.gov.sa/wp-content/uploads/2012/06/UthmanTN1-Ver10.zip' -o /tmp/uthman-font/font.zip
            unzip -q /tmp/uthman-font/font.zip -d /tmp/uthman-font/unpacked
            FONT=$(find /tmp/uthman-font/unpacked -type f -iname '*.ttf' | head -n 1 || true)
            test -n "$FONT"
            cp "$FONT" .build-fonts/UthmanTaha.ttf
          fi
      - name: Embed QURBATA vector mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/render_nidom_j1_batch_p012_p040.js')
          s=p.read_text()
          old="const logo='file://'+path.join(root,'books/nidom-akhlak/shared/assets/qurbata-logo.svg');"
          uri="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22249%22%20viewBox%3D%220%200%20220%20249%22%3E%0A%3Crect%20width%3D%22220%22%20height%3D%22249%22%20fill%3D%22white%22%2F%3E%0A%3Cellipse%20cx%3D%22110%22%20cy%3D%2292%22%20rx%3D%2264%22%20ry%3D%2272%22%20fill%3D%22none%22%20stroke%3D%22%23405d49%22%20stroke-width%3D%227%22%2F%3E%0A%3Cpath%20d%3D%22M155%20144%20Q178%20158%20187%20188%22%20fill%3D%22none%22%20stroke%3D%22%23405d49%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3Ctext%20x%3D%22110%22%20y%3D%22122%22%20text-anchor%3D%22middle%22%20font-size%3D%2286%22%20font-family%3D%22serif%22%20fill%3D%22%23203127%22%3E%D9%82%3C%2Ftext%3E%0A%3Ccircle%20cx%3D%2295%22%20cy%3D%2248%22%20r%3D%227%22%20fill%3D%22%23b9a56a%22%2F%3E%3Ccircle%20cx%3D%22119%22%20cy%3D%2243%22%20r%3D%227%22%20fill%3D%22%23b9a56a%22%2F%3E%0A%3Ctext%20x%3D%22110%22%20y%3D%22224%22%20text-anchor%3D%22middle%22%20font-size%3D%2225%22%20font-family%3D%22Arial%2Csans-serif%22%20letter-spacing%3D%224%22%20fill%3D%22%23405d49%22%3EQURBATA%3C%2Ftext%3E%0A%3C%2Fsvg%3E"
          new="const logo='"+uri+"';"
          if old not in s:
              raise SystemExit('LOGO_PATCH_TARGET_NOT_FOUND')
          p.write_text(s.replace(old,new))
          PY
      - name: Render P012-P040
        run: node tools/render_nidom_j1_batch_p012_p040.js
      - name: Verify batch
        run: |
          test -s dist/nidom-akhlak/jilid-1-batch/QURBATA-NIDOM-J1-MASTER-P012-P040-v1.0.pdf
          COUNT=$(find dist/nidom-akhlak/jilid-1-batch -maxdepth 1 -name 'QURBATA-NIDOM-J1-P*.pdf' | wc -l)
          test "$COUNT" -eq 29
      - uses: actions/upload-artifact@v4
        with:
          name: QURBATA-NIDOM-J1-BATCH-P012-P040-v1.0
          path: dist/nidom-akhlak/jilid-1-batch/*.pdf
          if-no-files-found: error