name: QURBATA Pedagogical Engine

on:
  push:
    branches:
      - content/qurbata-jilid-1-8-production
    paths:
      - 'content/qwo/**'
      - '.github/workflows/qurbata-pedagogical-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q content/qwo

      - name: Validate competency dependency map
        run: python content/qwo/pedagogical/runtime/foundation_smoke_test.py --mode dependency

      - name: Run pedagogical regression suite
        run: python content/qwo/pedagogical/runtime/foundation_smoke_test.py --mode regression

      - name: Run end-to-end foundation validation
        run: python content/qwo/pedagogical/runtime/foundation_smoke_test.py --mode all

      - name: Validate real Quran objects from letter to full ayah
        run: python content/qwo/pedagogy/runtime/real_object_acceptance_test.py

      - name: Require positive fixture coverage for C0001-C0041
        run: python content/qwo/pedagogy/runtime/competency_coverage_gate.py

      - name: Verify Tanzil corpus and generate master Quran objects
        run: |
          python content/qwo/production/runtime/corpus_candidate_generator.py \
            --corpus content/qwo/corpus/quran-uthmani.txt \
            --output content/qwo/production/generated/MASTER-QURAN-OBJECTS-V1.csv

      - name: Label candidates and audit sufficiency C0001-C0041
        run: |
          python content/qwo/production/runtime/candidate_sufficiency_pipeline.py \
            --objects content/qwo/production/generated/MASTER-QURAN-OBJECTS-V1.csv \
            --labeled-output content/qwo/production/generated/LABELED-QURAN-OBJECTS-V1.csv \
            --report-output content/qwo/production/generated/CANDIDATE-SUFFICIENCY-REPORT-V1.csv

      - name: Compose QURBATA volumes 1-8
        run: |
          python content/qwo/composer/runtime/series_composer_v1.py \
            --labeled content/qwo/production/generated/LABELED-QURAN-OBJECTS-V1.csv \
            --allocation content/qwo/composer/SERIES-COMPETENCY-ALLOCATION-V1.csv \
            --objects-per-competency 24 \
            --output content/qwo/production/generated/QURBATA-1-8-COMPOSITION-V1.csv

      - name: Require final readiness for QURBATA 1-8
        run: python content/qwo/production/runtime/final_readiness_gate.py

      - name: Upload production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qurbata-1-8-production
          if-no-files-found: warn
          path: |
            content/qwo/production/generated/MASTER-QURAN-OBJECTS-V1.csv
            content/qwo/production/generated/LABELED-QURAN-OBJECTS-V1.csv
            content/qwo/production/generated/CANDIDATE-SUFFICIENCY-REPORT-V1.csv
            content/qwo/production/generated/QURBATA-1-8-COMPOSITION-V1.csv
