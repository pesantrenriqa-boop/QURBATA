<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QURBATA J1 — A5 Staging</title>
<style>
@page {size:A5 portrait;margin:11mm 10mm 13mm}
*{box-sizing:border-box}body{margin:0;background:#eee;color:#153d3c;font-family:Arial,sans-serif}
.page{width:148mm;min-height:210mm;margin:12px auto;padding:11mm 10mm 13mm;background:white;display:flex;flex-direction:column;gap:4mm}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid #197c77;padding-bottom:3mm}
.brand{font-size:15px;font-weight:bold}.meta{font-size:9px;color:#596b6a}
.logo{width:17mm;height:17mm;object-fit:contain}.placeholder{font-size:8px;color:#9a5100}
.ar{font-family:"KFGQPC Uthman Taha",serif;direction:rtl;unicode-bidi:isolate}
.panel{border-radius:3mm;border:1px solid #c9ddda;padding:2.5mm}
.panel h2{margin:0 0 2mm;font-size:10px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2mm;direction:rtl}
.group{display:flex;align-items:center;justify-content:center;min-height:10mm;border-bottom:1px solid #d7e5e3;font-size:22px;white-space:nowrap;direction:rtl}
.group .token{display:inline-block;margin-inline:1.2mm}
.panel.small{min-height:17mm}.panel.small .ar{font-size:18px}
footer{margin-top:auto;border-top:1px solid #c9ddda;padding-top:3mm;font-size:9px;display:flex;justify-content:space-between}
@media print{body{background:white}.page{margin:0;break-after:page;width:auto;min-height:0;height:186mm;padding:0;box-shadow:none}.page:last-child{break-after:auto}}
</style></head><body><main id="pages"></main>
<script src="./qurbata-a5-staging-data-p001-p010.js"></script>
<script src="./qurbata-a5-staging-data-p002-p009.js"></script>
<script>
/* REVIEW-ONLY. Set window.QURBATA_PAGES to an array of validated records before this script.
Example record: {page:"P001",grid:[24 arrays of 2 or 3 detached tokens],biah:"...",akhlak:"...",tahfidz:{surah:"An-Nas",ayah:1,arabic:"",translation_id:""},logo_url:"",qr_url:"",gate:"REVIEW"}.
Never supply unverified ayah/translation to print. */
(function(){
 const pages=[...(window.QURBATA_PAGES||[]),...(window.QURBATA_PAGES_MIDDLE||[])].sort((a,b)=>Number(a.page.slice(1))-Number(b.page.slice(1)));
 const root=document.getElementById("pages");
 const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
 for(const data of pages){
  if(!Array.isArray(data.grid)||data.grid.length!==24||data.grid.some(g=>!Array.isArray(g)||g.length<2||g.length>5))throw Error("Invalid 8x3 grid "+data.page);
  const page=el("article","page"),header=el("header");
  if(data.gate&&data.gate.includes("BLOCKED")){page.style.outline="2px dashed #a45c1d";page.setAttribute("data-release","BLOCKED");}
  const identity=el("div");identity.append(el("div","brand","QURBATA"),el("div","meta","JILID 1 · "+data.page+" · DRAF TASHIH"));
  header.append(identity);
  if(data.logo_url){const img=el("img","logo");img.src=data.logo_url;img.alt="Logo resmi";header.append(img)}else header.append(el("span","placeholder","LOGO BELUM TERPASANG"));
  page.append(header);
  const tartil=el("section","panel");tartil.append(el("h2","","TARTIL"));
  const grid=el("div","grid");
  for(const group of data.grid){const g=el("div","group ar");for(const token of group)g.append(el("span","token",token));grid.append(g)}
  tartil.append(grid);page.append(tartil);
  for(const [title,value] of [["بِيئَةٌ عَرَبِيَّةٌ",data.biah],["الْأَخْلَاقُ",data.akhlak]]){
    const panel=el("section","panel small");panel.append(el("h2","ar",title),el("div","ar",value||""));page.append(panel)
  }
  const t=el("section","panel small");t.append(el("h2","","TAHFIDZ · "+(data.tahfidz?.surah||"")+" : "+(data.tahfidz?.ayah||"")));
  if(data.tahfidz?.verified===true&&data.tahfidz.arabic&&data.tahfidz.translation_id){
    t.append(el("div","ar",data.tahfidz.arabic),el("div","",data.tahfidz.translation_id));
  }else t.append(el("div","placeholder","TEKS AYAT & ARTI MENUNGGU TASHIH — TIDAK UNTUK CETAK"));
  page.append(t);
  const foot=el("footer");foot.append(el("span","","Nilai: ______"),el("span","","Tanggal: ______"),el("span","","Paraf: ______"));
  page.append(foot,el("div","meta","STATUS: "+(data.gate||"REVIEW ONLY")+" · BUKAN SIAP CETAK"));root.append(page);
 }
 if(!pages.length)root.append(el("p","placeholder","Belum ada data halaman. Muat window.QURBATA_PAGES dari sumber kandidat terverifikasi."));
})();
</script></body></html>
