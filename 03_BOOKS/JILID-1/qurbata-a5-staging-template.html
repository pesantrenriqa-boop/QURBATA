<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QURBATA J1 — A5 Staging</title>
<style>
@page {size:A5 portrait;margin:11mm 10mm 13mm}
*{box-sizing:border-box}body{margin:0;background:#eee;color:#153d3c;font-family:Arial,sans-serif}
.page{position:relative;width:148mm;min-height:210mm;margin:12px auto;padding:11mm 10mm 13mm;background:white;display:flex;flex-direction:column;gap:4mm}
.qa-banner{font:700 10px Arial,sans-serif;padding:7px 10px;background:#fff1d6;color:#633d00;text-align:center}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid #197c77;padding-bottom:3mm}
.brand{font-size:15px;font-weight:bold}.meta{font-size:9px;color:#596b6a}
.logo{width:17mm;height:17mm;object-fit:contain}.placeholder{font-size:8px;color:#9a5100}
.ar{font-family:"KFGQPC Uthman Taha",serif;direction:rtl;unicode-bidi:isolate}
.page::after{content:"DRAF · TIDAK UNTUK CETAK FINAL";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-34deg);font:700 21px Arial,sans-serif;color:rgba(160,70,30,.17);pointer-events:none;white-space:nowrap;z-index:5}.panel{border-radius:3mm;border:1px solid #c9ddda;padding:2.5mm}
.panel h2{margin:0 0 2mm;font-size:10px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2mm;direction:rtl}
/* J2-J8 adaptive grid primitives; J1 staging behavior remains unchanged */
.exercise-row{display:grid;gap:2mm;direction:rtl;break-inside:avoid;margin-bottom:2mm}
.exercise-row[data-columns="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.exercise-row[data-columns="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.exercise-row[data-columns="1"]{grid-template-columns:minmax(0,1fr)}
.exercise-cell{min-width:0;min-height:11mm;padding:2mm;display:flex;align-items:center;justify-content:center;border:1px solid #c9ddda;border-radius:1.5mm;direction:rtl;unicode-bidi:isolate;overflow-wrap:anywhere;white-space:normal;line-height:1.9}
.exercise-row[data-columns="1"] .exercise-cell{justify-content:flex-start;text-align:right;min-height:14mm}
.exercise-row[data-columns="1"][data-phase="fluency"] .exercise-cell{font-size:20px}
@media print{.exercise-row,.exercise-cell{break-inside:avoid}}
.group{display:flex;align-items:center;justify-content:center;min-height:10mm;border-bottom:1px solid #d7e5e3;font-size:22px;white-space:nowrap;direction:rtl}
.group .token{display:inline-block;margin-inline:1.2mm}
.panel.small{min-height:17mm}.panel.small .ar{font-size:18px}
footer{margin-top:auto;border-top:1px solid #c9ddda;padding-top:3mm;font-size:9px;display:flex;justify-content:space-between}
@media print{.qa-banner{display:block!important;position:fixed;top:0;left:0;right:0;z-index:99;font-size:8px}.page::after{color:rgba(160,70,30,.22)}body{background:white}.page{margin:0;break-after:page;width:auto;min-height:0;height:186mm;padding:0;box-shadow:none}.page:last-child{break-after:auto}}
</style></head><body><div id="qa-banner" class="qa-banner" role="status">STAGING · BELUM LULUS QA FONT, TASHIH DAN CC-001 · JANGAN CETAK SEBAGAI BUKU FINAL</div><main id="pages"></main>
<script src="./qurbata-a5-staging-data-p001-p010.js"></script>
<script src="./qurbata-a5-staging-data-p002-p009.js"></script>
<script>
/* REVIEW-ONLY. Set window.QURBATA_PAGES to an array of validated records before this script.
Example record: {page:"P001",grid:[24 arrays of 2 or 3 detached tokens],biah:"...",akhlak:"...",tahfidz:{surah:"An-Nas",ayah:1,arabic:"",translation_id:""},logo_url:"",qr_url:"",gate:"REVIEW"}.
Never supply unverified ayah/translation to print. */
(function(){
 const pages=[...(window.QURBATA_PAGES||[]),...(window.QURBATA_PAGES_MIDDLE||[])].sort((a,b)=>Number(a.page.slice(1))-Number(b.page.slice(1)));
 const root=document.getElementById("pages");
 const expected=Array.from({length:10},(_,i)=>"P"+String(i+1).padStart(3,"0"));
 const found=pages.map(x=>x.page);
 if(JSON.stringify(found)!==JSON.stringify(expected))throw Error("Missing, duplicate or misordered page in P001-P010 data");
 const blocked=new Set(["P002","P005","P006","P007","P008","P009"]);
 const targetByPage={"P001":"بَ تَ ثَ","P002":"ءَ أَ","P003":"جَ حَ خَ","P004":"دَ ذَ رَ زَ","P005":"سَ شَ","P006":"صَ ضَ","P007":"طَ ظَ","P008":"عَ غَ","P009":"فَ قَ"};
 const legal=new Set();
 function gatePage(data){
  const isCheckpoint=data.page==="P010";const target=(targetByPage[data.page]||"").split(" ").filter(Boolean);
  if(!isCheckpoint)target.forEach(t=>legal.add(t));
  const grid=data.grid;
  if(!Array.isArray(grid)||grid.length!==24)throw Error("24 groups required "+data.page);
  const keys=[];let countTarget=0;
  grid.forEach((group,i)=>{
   if(!Array.isArray(group)||group.length<(isCheckpoint?2:i<6?2:3)||(!isCheckpoint&&group.length!==(i<6?2:3))||group.length>5)throw Error("Invalid group length "+data.page+" group "+(i+1));
   group.forEach(token=>{if(!legal.has(token))throw Error("Future/illegal token "+data.page+" "+token);if(target.includes(token))countTarget++;if(i<6&&!isCheckpoint&&!target.includes(token))throw Error("Planting mismatch "+data.page)});
   if(!isCheckpoint&&i>=6&&!group.some(token=>target.includes(token)))throw Error("Practice missing target "+data.page);
   keys.push(group.join("|"));
  });
  const dup=keys.length-new Set(keys).size;
  if(dup!==(blocked.has(data.page)?2:0))throw Error("Unexpected duplicate groups "+data.page+" "+dup);
  if(!isCheckpoint&&countTarget!==(data.page==="P001"?66:40))throw Error("Target ratio mismatch "+data.page);
  if(blocked.has(data.page)&&!String(data.gate).includes("CC-001"))throw Error("Missing CC-001 block "+data.page);
  return {dup,countTarget};
 }
 pages.forEach(gatePage);
 const fontOK=!!(document.fonts&&Array.from(document.fonts).some(f=>f.family.replace(/[\x22\x27]/g,"").trim().toLowerCase()==="kfgqpc uthman taha"&&f.status==="loaded"));
 const qaBanner=document.getElementById("qa-banner");
 qaBanner.textContent="STAGING · "+(fontOK?"FONT TERDETEKSI":"FONT UTHMAN TAHA BELUM TERDETEKSI")+" · CC-001 BELUM DISETUJUI · TASHIH BELUM SELESAI";
 window.addEventListener("beforeprint",()=>{qaBanner.style.display="block";});
 const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
 for(const data of pages){
  if(!Array.isArray(data.grid)||data.grid.length!==24||data.grid.some(g=>!Array.isArray(g)||g.length<2||g.length>5))throw Error("Invalid 8x3 grid "+data.page);
  const page=el("article","page"),header=el("header");
  if(data.gate&&data.gate.includes("BLOCKED")){page.style.outline="2px dashed #a45c1d";page.setAttribute("data-release","BLOCKED");}
  const identity=el("div");identity.append(el("div","brand","QURBATA"),el("div","meta","JILID 1 · "+data.page+" · DRAF TASHIH"));
  header.append(identity);
  if(data.logo_url){const img=el("img","logo");img.src=data.logo_url;img.alt="Logo resmi";header.append(img)}else header.append(el("span","placeholder","LOGO BELUM TERPASANG"));
  page.append(header);
  const tartil=el("section","panel");tartil.append(el("h2","","TARTIL"));
  const grid=el("div","grid");
  for(const group of data.grid){const g=el("div","group ar");for(const token of group)g.append(el("span","token",token));grid.append(g)}
  tartil.append(grid);page.append(tartil);
  for(const [title,value] of [["بِيئَةٌ عَرَبِيَّةٌ",data.biah],["الْأَخْلَاقُ",data.akhlak]]){
    const panel=el("section","panel small");panel.append(el("h2","ar",title),el("div","ar",value||""));page.append(panel)
  }
  const t=el("section","panel small");t.append(el("h2","","TAHFIDZ · "+(data.tahfidz?.surah||"")+" : "+(data.tahfidz?.ayah||"")));
  if(data.tahfidz?.verified===true&&data.tahfidz.arabic&&data.tahfidz.translation_id){
    t.append(el("div","ar",data.tahfidz.arabic),el("div","",data.tahfidz.translation_id));
  }else t.append(el("div","placeholder","TEKS AYAT & ARTI MENUNGGU TASHIH — TIDAK UNTUK CETAK"));
  page.append(t);
  const foot=el("footer");foot.append(el("span","","Nilai: ______"),el("span","","Tanggal: ______"),el("span","","Paraf: ______"));
  page.append(foot,el("div","meta","STATUS: "+(data.gate||"REVIEW ONLY")+" · BUKAN SIAP CETAK"));root.append(page);
 }
 requestAnimationFrame(()=>{for(const page of root.querySelectorAll(".page")){const bounds=page.getBoundingClientRect();const last=page.lastElementChild?.getBoundingClientRect();if(last&&last.bottom>bounds.bottom+1){page.dataset.overflow="YES";page.style.outline="3px solid #b42318";console.error("A5 overflow",page.querySelector(".meta")?.textContent);}}});
 if(!pages.length)root.append(el("p","placeholder","Belum ada data halaman. Muat window.QURBATA_PAGES dari sumber kandidat terverifikasi."));
})();
</script></body></html>
